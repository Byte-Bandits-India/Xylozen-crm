name: Build and Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'dashBoard/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashBoard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashBoard/package-lock.json

      - name: Install and build
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Package release
        run: tar czf ../frontend-release.tgz dist

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: frontend-release.tgz
          target: /home/ec2-user/deploy-staging

      - name: Activate release on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            BASE=/var/www/dashboard-prod-frontend
            TS=$(date +%Y%m%d_%H%M%S)
            mkdir -p $BASE/releases/$TS
            tar xzf /home/ec2-user/deploy-staging/frontend-release.tgz -C $BASE/releases/$TS
            ln -sfn "releases/$TS" $BASE/current
            ls -1dt $BASE/releases/* | tail -n +4 | xargs -r rm -rf
            rm -f /home/ec2-user/deploy-staging/frontend-release.tgz
            echo "Deployed frontend $TS"
