name: Build and Deploy Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dashboard-Backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      env_target: ${{ steps.set_env.outputs.env_target }}
      container_name: ${{ steps.set_env.outputs.container_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment target
        id: set_env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_TARGET="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV_TARGET="prod"
          else
            ENV_TARGET="test"
          fi

          echo "ENV_TARGET=$ENV_TARGET" >> $GITHUB_ENV
          echo "CONTAINER_NAME=backend-$ENV_TARGET" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/dashboard-backend" >> $GITHUB_ENV

          echo "env_target=$ENV_TARGET" >> $GITHUB_OUTPUT
          echo "container_name=backend-$ENV_TARGET" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Dashboard-Backend
          file: ./Dashboard-Backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.ENV_TARGET }}-latest
            ${{ env.IMAGE_NAME }}:${{ env.ENV_TARGET }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose config and Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Dashboard-Backend/deploy/docker-compose.yml,Dashboard-Backend/deploy/Caddyfile"
          target: "/home/ec2-user/dashboard"
          strip_components: 2

      - name: Pull image and restart backend service and proxy
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_CONTAINER: ${{ needs.build-and-push.outputs.container_name }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TARGET_CONTAINER
          script: |
            set -e
            cd /home/ec2-user/dashboard
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull $TARGET_CONTAINER phpmyadmin caddy
            docker compose up -d --remove-orphans $TARGET_CONTAINER phpmyadmin caddy
            docker image prune -f
