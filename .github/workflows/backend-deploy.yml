name: Build and Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'Dashboard-Backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard-Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Dashboard-Backend/package-lock.json

      - name: Install, generate Prisma client and build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Package release
        run: tar czf ../backend-release.tgz dist prisma package.json package-lock.json

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend-release.tgz
          target: /home/ec2-user/deploy-staging

      - name: Activate release on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            [ -f ~/.bashrc ] && . ~/.bashrc || true
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            BASE=/var/www/dashboard-prod-backend
            TS=$(date +%Y%m%d_%H%M%S)
            NEW=$BASE/releases/$TS
            CUR=$(readlink -f $BASE/current)

            # Refuse to deploy onto a nearly full disk
            AVAIL_MB=$(df -Pm /var/www | awk 'NR==2{print $4}')
            if [ "$AVAIL_MB" -lt 1500 ]; then echo "Only ${AVAIL_MB}MB free, aborting"; exit 1; fi

            # Remove the half-built release if anything below fails; the live release is never touched
            trap 'rm -rf "$NEW"' ERR

            # Fresh release folder (no copy of the old node_modules): link the shared env and uploads
            mkdir -p "$NEW" $BASE/shared/uploads
            ln -s $BASE/shared/.env "$NEW/.env"
            ln -s $BASE/shared/uploads "$NEW/uploads"
            tar xzf /home/ec2-user/deploy-staging/backend-release.tgz -C "$NEW"
            cd "$NEW"
            npm ci --omit=dev
            npx prisma generate
            # Apply database migrations BEFORE switching traffic
            npx prisma migrate deploy

            ln -sfn "releases/$TS" $BASE/current
            pm2 restart dashboard-prod-backend --update-env
            pm2 save

            # keep the 3 newest releases (live + 2 for rollback) to save disk
            ls -1dt $BASE/releases/* | tail -n +4 | xargs -r rm -rf
            rm -f /home/ec2-user/deploy-staging/backend-release.tgz
            echo "Deployed $TS (previous release: $CUR)"
