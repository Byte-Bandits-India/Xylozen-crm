services:
  # ==========================================
  # PRODUCTION SERVICES (crm.xylozentech.com)
  # ==========================================
  backend-prod:
    image: ghcr.io/byte-bandits-india/dashboard-backend:prod-latest
    restart: unless-stopped
    env_file: .env.backend.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_prod_data:/app/uploads
    expose:
      - "4000"
    networks:
      - app

  frontend-prod:
    image: ghcr.io/byte-bandits-india/dashboard-frontend:prod-latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app

  # ==========================================
  # TEST SERVICES (testcrm.xylozentech.com)
  # ==========================================
  backend-test:
    image: ghcr.io/byte-bandits-india/dashboard-backend:test-latest
    restart: unless-stopped
    env_file: .env.backend.test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_test_data:/app/uploads
    expose:
      - "4000"
    networks:
      - app

  frontend-test:
    image: ghcr.io/byte-bandits-india/dashboard-frontend:test-latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app

  # ==========================================
  # SHARED GATEWAY & DATABASE MANAGEMENT
  # ==========================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: "https://crm.xylozentech.com/phpmyadmin/"
      UPLOAD_LIMIT: 64M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "80"
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app

networks:
  app:

volumes:
  uploads_prod_data:
  uploads_test_data:
  caddy_data:
  caddy_config:
