[build]
  base = "dashBoard"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://api-crm.xylozentech.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify-CDN"}

[[redirects]]
  from = "/uploads/*"
  to = "https://api-crm.xylozentech.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200