# Netlify Configuration for Xylozen-crm Frontend (Monorepo Root)
[build]
  base = "dashBoard"
  publish = "dist"
  command = "npm run build"

# 1. Reverse-proxy all API requests to the EC2 backend
[[redirects]]
  from = "/api/*"
  to = "https://api-crm.xylozentech.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify-CDN"}

# 2. Reverse-proxy uploaded images and files from EC2 shared storage
[[redirects]]
  from = "/uploads/*"
  to = "https://api-crm.xylozentech.com/uploads/:splat"
  status = 200
  force = true

# 3. SPA Fallback (Prevents 404s on page refresh for React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
